services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tenantmind
      POSTGRES_USER: tenantmind
      POSTGRES_PASSWORD: tenantmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tenantmind:tenantmind@db:5432/tenantmind
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: /backend
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
