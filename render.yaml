services:
  - type: web
    name: tenantmind-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        value: https://tenantmind-ai.onrender.com

  - type: web
    name: tenantmind-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeploy: true
    envVars:
      - key: STATIC_EXPORT
        value: true
      - key: NEXT_PUBLIC_API_URL
        value: https://tenantmind-ai-api.onrender.com
